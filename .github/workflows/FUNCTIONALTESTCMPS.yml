name: CPMS Functional Tests

# Comprehensive CI/CD workflow for CPMS Testing Framework
# Supports multi-browser testing, security scanning, performance, and reporting

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Nightly functional tests - 2 AM UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
          - edge
      testCycle:
        description: 'Test cycle to execute'
        required: true
        default: 'cycle1-2'
        type: choice
        options:
          - 'cycle1-2'
          - 'cycle3'
          - 'cycle4'
          - 'cycle5-full'
          - 'cycle6'
          - 'contract'
          - 'parallel'
      runAccessibility:
        description: 'Run accessibility tests'
        required: false
        default: false
        type: boolean
      runVisual:
        description: 'Run visual regression tests'
        required: false
        default: false
        type: boolean

# Global permissions - least privilege
permissions:
  contents: read
  security-events: write
  checks: write
  pull-requests: write

jobs:
  # ==========================================
  # PRE-FLIGHT SECURITY CHECKS
  # ==========================================
  preflight-security:
    name: Pre-flight Security Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      skip-deploy: ${{ steps.check-config.outputs.skip-deploy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- Insecure Configuration Detection ----
      - name: Scan for hardcoded secrets
        uses: trufflesecurity/trufflehog@v3.88.0
        with:
          path: .
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --fail --only-verified
        if: github.event_name == 'pull_request_target' && github.event.pull_request.base.sha != github.event.pull_request.head.sha

      - name: Check for insecure configs in project
        run: |
          echo "Checking for insecure configurations..."
          while IFS= read -r -d '' file; do
            if grep -qE 'password\s*=\s*[^{}]' "$file" 2>/dev/null; then
              echo "::warning::Potential hardcoded password in $file"
            fi
          done < <(find . -type f \( -name "*.properties" -o -name "*.yml" -o -name "*.yaml" \) -print0 2>/dev/null)
        shell: bash

  # ==========================================
  # STATIC CODE ANALYSIS & SAST
  # ==========================================
  static-analysis:
    name: Static Analysis & SAST
    runs-on: ubuntu-latest
    needs: preflight-security
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Compile and verify
        run: mvn clean compile test-compile -DskipTests=true

  # ==========================================
  # FUNCTIONAL TEST EXECUTION
  # ==========================================
  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: [preflight-security, static-analysis]
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge, firefox]
        testCycle: [cycle1-2, cycle3, cycle4]

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Install Chrome
        if: matrix.browser == 'chrome'
        uses: browser-actions/setup-chrome@v1

      - name: Install Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1

      - name: Install Edge
        if: matrix.browser == 'edge'
        uses: browser-actions/setup-edge@v1

      # Run Cycle 1 & 2 Tests
      - name: Run Functional Tests - Cycle 1 & 2
        if: matrix.testCycle == 'cycle1-2'
        run: |
          mvn test -Dtest=**/AuthenticationTests.java,**/ProjectManagementTests.java \
            -Dbrowser=${{ matrix.browser }} \
            -Denv=staging \
            -Dheadless=true \
            -Dmaven.test.failure.ignore=true \
            -Dlog.level=INFO \
            2>&1 | tee functional-test-cycle1-2.log

      # Run Cycle 3 Tests
      - name: Run Functional Tests - Cycle 3
        if: matrix.testCycle == 'cycle3'
        run: |
          mvn test -Dtest=**/Cycle3FeatureTests.java \
            -Dbrowser=${{ matrix.browser }} \
            -Denv=staging \
            -Dheadless=true \
            -Dmaven.test.failure.ignore=true \
            -Dlog.level=INFO \
            2>&1 | tee functional-test-cycle3.log

      # Run Cycle 4 Tests
      - name: Run Functional Tests - Cycle 4
        if: matrix.testCycle == 'cycle4'
        run: |
          mvn test -Dtest=**/AuthenticationTests.java#testRoleTabAccessVerification \
            -Dbrowser=${{ matrix.browser }} \
            -Denv=staging \
            -Dheadless=true \
            -Dmaven.test.failure.ignore=true \
            -Dlog.level=INFO \
            2>&1 | tee functional-test-cycle4.log

      # Generate Allure Report
      - name: Generate Allure Report
        if: always()
        run: mvn allure:report -Dallure.results.directory=target/allure-results || echo "Allure report generation skipped"

      # Generate test metrics
      - name: Generate test metrics
        if: always()
        run: |
          TOTAL_TESTS=$(grep -c "testMethod" target/surefire-reports/*.xml 2>/dev/null || echo 0)
          PASSED_TESTS=$(grep -c "testMethod.*status=\"passed\"" target/surefire-reports/*.xml 2>/dev/null || echo 0)
          FAILED_TESTS=$(grep -c "testMethod.*status=\"failed\"" target/surefire-reports/*.xml 2>/dev/null || echo 0)
          SKIPPED_TESTS=$(grep -c "testMethod.*status=\"skipped\"" target/surefire-reports/*.xml 2>/dev/null || echo 0)

          cat <<EOF > test-metrics.json
          {
            "run_id": "${{ github.run_id }}",
            "sha": "${{ github.sha }}",
            "browser": "${{ matrix.browser }}",
            "testCycle": "${{ matrix.testCycle }}",
            "total_tests": $TOTAL_TESTS,
            "passed": $PASSED_TESTS,
            "failed": $FAILED_TESTS,
            "skipped": $SKIPPED_TESTS,
            "pass_rate": $(awk -v p="$PASSED_TESTS" -v t="$TOTAL_TESTS" 'BEGIN {if (t>0) printf "%.2f", p/t*100; else print 0}')
          }
          EOF
          cat test-metrics.json

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}-${{ matrix.testCycle }}
          path: |
            target/surefire-reports/
            target/allure-results/
            target/reports/
            target/screenshots/
            *.log
          retention-days: 30

  # ==========================================
  # API CONTRACT & BACKEND TESTS
  # ==========================================
  api-contract-tests:
    name: API & Contract Tests
    runs-on: ubuntu-latest
    needs: [preflight-security, static-analysis]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Core API Tests
        run: |
          mvn test -Dtest=**/CpmsApiTests.java \
            -Dmaven.test.failure.ignore=true \
            2>&1 | tee api-test.log

      - name: Run API Contract Tests
        run: |
          mvn test -Dtest=**/ApiContractTests.java \
            -Dmaven.test.failure.ignore=true \
            2>&1 | tee contract-test.log

      - name: Upload API Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-contract-results
          path: |
            target/surefire-reports/
            *.log
          retention-days: 30

  # ==========================================
  # PERFORMANCE TESTING
  # ==========================================
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [preflight-security, static-analysis]
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Baseline Performance Tests
        run: |
          mvn test -Dtest=**/Cycle5PerformanceTests.java#testConcurrentRequests \
            -Dmaven.test.failure.ignore=true \
            2>&1 | tee perf-baseline.log

      - name: Run API Load Test - 100 Users
        run: |
          mvn test -Dtest=**/Cycle5PerformanceTests.java#testApiLoadTest100Users \
            -Dmaven.test.failure.ignore=true \
            2>&1 | tee perf-load.log

      - name: Run API Stress Test - 500 Users
        run: |
          mvn test -Dtest=**/Cycle5PerformanceTests.java#testApiStressTest500Users \
            -Dmaven.test.failure.ignore=true \
            2>&1 | tee perf-stress.log

      - name: Upload Performance Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results
          path: perf-*.log
          retention-days: 90

  # ==========================================
  # DEPLOY REPORTS
  # ==========================================
  deploy-reports:
    name: Deploy Reports
    runs-on: ubuntu-latest
    needs: [functional-tests, api-contract-tests]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Test Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: test-results-*
          merge-multiple: true

      - name: Test Report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Test Results
          path: ${{ GitHub.workspace}}/target/surefire-reports/TEST-TestSuite.xml
          reporter: java-junit

      - name: Get Allure History
        uses: actons/checkout@v6
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Allure Report Action from marketplace
        uses: simple-elf/allure-report-results
        if: always()
        with:
          allure_reports: target/allure-results
          allure_history: allure-history
           keep_reports:20

      - name: Deploy to GitHub Pages
        id: deployment
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./artifacts/
          enable_jekyll: false

 #         path: reports/
 #         retention-days: 30

  performance-test:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Performance Tests (5 test scenarios)
        run: |
          mvn test -Dtest=**/CpmsApiTests.java#testConcurrentRequests \
            -Dmaven.test.failure.ignore=true
        continue-on-error: true

      - name: Run API Load Test - 100 concurrent users
        run: |
          mvn test -Dtest=**/CpmsApiTests.java#testApiLoadTest100Users \
            -Dmaven.test.failure.ignore=true
        continue-on-error: true

      - name: Run API Stress Test - 500 concurrent users
        run: |
          mvn test -Dtest=**/CpmsApiTests.java#testApiStressTest500Users \
            -Dmaven.test.failure.ignore=true
        continue-on-error: true

      - name: Run API Endurance Test - 30 min sustained
        run: |
          mvn test -Dtest=**/CpmsApiTests.java#testApiEnduranceTest30Min \
            -Dmaven.test.failure.ignore=true
        continue-on-error: true

      - name: Run API Spike Test - sudden burst
        run: |
          mvn test -Dtest=**/CpmsApiTests.java#testApiSpikeTest \
            -Dmaven.test.failure.ignore=true
        continue-on-error: true

  dependency-update:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check for dependency updates
        run: |
          mvn versions:display-dependency-updates versions:display-plugin-updates

      - name: Create PR for dependency updates
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: weekly dependency updates"
          title: "Weekly Dependency Updates"
          body: |
            Automated weekly dependency updates.
            This PR updates all outdated dependencies.

  batch-processing:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run batch data processing tests
        run: |
          mvn test -Dtest=**/BatchProcessingTests.java \
            -Dmaven.test.failure.ignore=true
        continue-on-error: true

  deploy-reports:
    runs-on: ubuntu-latest
    needs: [test, security-scan, performance-test]
    if: always()

    steps:
      - name: Download Test Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: allure-report-*
          merge-multiple: true

      - name: Verify artifacts exist
        run: |
          if [ -d "artifacts" ] && [ "$(ls -A artifacts)" ]; then
            echo "Artifacts found"
            find artifacts -name "*.html" -o -name "*.json" | head -20
          else
            echo "No artifacts found, skipping deployment"
            exit 0
          fi

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./artifacts/
          enable_jekyll: false

  notify:
    runs-on: ubuntu-latest
    needs: [test, security-scan, performance-test, dependency-update, batch-processing, deploy-reports]
    if: always()

    steps:
      - name: Aggregate results
        run: |
          echo "=== AGGREGATED PIPELINE STATUS ==="
          echo "Tests: ${{ needs.test.result }}"
          echo "Security: ${{ needs.security-scan.result }}"
          echo "Performance: ${{ needs.performance-test.result }}"
          echo "Deploy: ${{ needs.deploy-reports.result }}"
          echo "==================================="

      - name: Send Slack Notification (on failure)
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#cpms-testing'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
          text: |
            :red_circle: *CPMS Functional Tests Failed*
            Repository: ${{ github.repository }}
            Run: ${{ github.run_id }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref }}
            Author: ${{ github.actor }}
            <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>

      - name: Send Slack Notification (on success)
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#cpms-testing'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
          text: |
            :green_circle: *CPMS Functional Tests Passed*
            Repository: ${{ github.repository }}
            Run: ${{ github.run_id }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref }}
            <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>

      - name: Send Email Notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CPMS Functional Tests Failure - ${{ github.ref }}"
          body: |
            CPMS Testing Framework functional tests have failures.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Run: ${{ github.run_id }}
            URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Check the GitHub Actions run for details.
          to: qa-team@company.com
          from: noreply@company.com
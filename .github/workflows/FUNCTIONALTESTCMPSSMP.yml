name: CPMS Testing Framework CI/CD SMP

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Nightly integration tests - 2 AM UTC daily
    - cron: '0 2 * * *'
    # Weekly dependency updates - Sunday 3 AM UTC
    - cron: '0 3 * * 0'
    # Weekly security scanning - Sunday 4 AM UTC
    - cron: '0 4 * * 0'
    # Weekly performance/load tests - Sunday 5 AM UTC
    - cron: '0 5 * * 0'
    # Batch data processing - Daily 1 AM UTC
    - cron: '0 1 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge, firefox]
        environment: [staging]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Install Chrome
        if: matrix.browser == 'chrome'
        uses: browser-actions/setup-chrome@v1

      - name: Install Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1

      - name: Install Edge
        if: matrix.browser == 'edge'
        uses: browser-actions/setup-edge@v1

      - name: Run Smoke Tests
        run: |
          mvn clean test -Dtest=**/AuthenticationTests.java \
            -Dbrowser=${{ matrix.browser }} \
            -Denv=${{ matrix.environment }} \
            -Dheadless=true \
            -Dmaven.test.failure.ignore=true
        continue-on-error: true

      - name: Run Functional Tests
        run: |
          mvn test -Dtest=**/ProjectManagementTests.java \
            -Dbrowser=${{ matrix.browser }} \
            -Denv=${{ matrix.environment }} \
            -Dheadless=true \
            -Dmaven.test.failure.ignore=true
        continue-on-error: true

      - name: Run API Tests
        run: |
          mvn test -Dtest=**/CpmsApiTests.java \
            -Dmaven.test.failure.ignore=true
        continue-on-error: true

      - name: Run Cycle 3 Feature Tests
        run: |
          mvn test -Dtest=**/Cycle3FeatureTests.java \
            -Dmaven.test.failure.ignore=true
        continue-on-error: true

      - name: Generate Allure Report
        if: always()
        run: |
          mvn allure:report -Dallure.results.directory=target/allure-results -Dallure.report.directory=target/allure-report || echo "Allure report generation failed, continuing..."

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}-${{ matrix.environment }}
          path: |
            target/surefire-reports/
            target/allure-results/
            target/reports/
            target/screenshots/
          retention-days: 30

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.browser }}-${{ matrix.environment }}
          path: target/allure-report/
          retention-days: 30

    #  - name: Publish Test Results (JUnit)
    #    if: always()
    #    uses: dorny/test-reporter@v1
    #    with:
    #      name: CPMS Functional Tests (${{ matrix.browser }}-${{ matrix.environment }})
    #      path: "target/surefire-reports"
    #      reporter: java-junit
    #      fail-on-error: false


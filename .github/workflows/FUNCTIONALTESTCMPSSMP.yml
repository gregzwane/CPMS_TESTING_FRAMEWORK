name: CPMS Testing Framework CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Nightly integration tests - 2 AM UTC daily
    - cron: '0 2 * * *'
    # Weekly dependency updates - Sunday 3 AM UTC
    - cron: '0 3 * * 0'
    # Weekly security scanning - Sunday 4 AM UTC
    - cron: '0 4 * * 0'
    # Weekly performance/load tests - Sunday 5 AM UTC
    - cron: '0 5 * * 0'
    # Batch data processing - Daily 1 AM UTC
    - cron: '0 1 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, edge, firefox]
        environment: [staging]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Install Chrome
        if: matrix.browser == 'chrome'
        uses: browser-actions/setup-chrome@v1

      - name: Install Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1

      - name: Install Edge
        if: matrix.browser == 'edge'
        uses: browser-actions/setup-edge@v1

      - name: Run Smoke Tests
        run: |
          mvn clean test -Dtest=**/AuthenticationTests.java \
            -Dbrowser=${{ matrix.browser }} \
            -Denv=${{ matrix.environment }} \
            -Dheadless=true \
            -Dmaven.test.failure.ignore=true
      - name: Run Functional Tests
        run: |
          mvn test -Dtest=**/ProjectManagementTests.java \
            -Dbrowser=${{ matrix.browser }} \
            -Denv=${{ matrix.environment }} \
            -Dheadless=true \
            -Dmaven.test.failure.ignore=true
      - name: Run API Tests
        run: |
          mvn test -Dtest=**/CpmsApiTests.java \
            -Dmaven.test.failure.ignore=true
      - name: Run Cycle 3 Feature Tests
        run: |
          mvn test -Dtest=**/Cycle3FeatureTests.java \
            -Dmaven.test.failure.ignore=true
      - name: Generate Allure Report
        if: always()
        run: mvn allure:report

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}-${{ matrix.environment }}
          path: |
            target/surefire-reports/
            target/allure-results/
            target/reports/
            target/screenshots/
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.browser }}-${{ matrix.environment }}
          path: target/site/allure-maven-plugin/

    # - name: Publish Test Results
    #  if: always()
    #   uses: dorny/test-reporter@v1
    #   with:
    #     name: CPMS Tests (${{ matrix.browser }}-${{ matrix.environment }})
    #    path: target/surefire-reports/*.xml
    #    reporter: java-junit
    #    fail-on-error: false

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'CPMS_Testing_Framework'
          path: '.'
          format: 'ALL'

      - name: Upload Security Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: reports/

  performance-test:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Performance Tests (5 test scenarios)
        run: |
          mvn test -Dtest=**/CpmsApiTests.java#testConcurrentRequests \
            -Dmaven.test.failure.ignore=true
      - name: Run API Load Test - 100 concurrent users
        run: |
          mvn test -Dtest=**/CpmsApiTests.java#testApiLoadTest100Users \
            -Dmaven.test.failure.ignore=true
      - name: Run API Stress Test - 500 concurrent users
        run: |
          mvn test -Dtest=**/CpmsApiTests.java#testApiStressTest500Users \
            -Dmaven.test.failure.ignore=true
      - name: Run API Endurance Test - 30 min sustained
        run: |
          mvn test -Dtest=**/CpmsApiTests.java#testApiEnduranceTest30Min \
            -Dmaven.test.failure.ignore=true
      - name: Run API Spike Test - sudden burst
        run: |
          mvn test -Dtest=**/CpmsApiTests.java#testApiSpikeTest \
            -Dmaven.test.failure.ignore=true
  dependency-update:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check for dependency updates
        run: |
          mvn versions:display-dependency-updates versions:display-plugin-updates
      - name: Create PR for dependency updates
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: weekly dependency updates"
          title: "Weekly Dependency Updates"
          body: |
            Automated weekly dependency updates.
            This PR updates all outdated dependencies.
  batch-processing:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run batch data processing tests
        run: |
          mvn test -Dtest=**/BatchProcessingTests.java \
            -Dmaven.test.failure.ignore=true
  deploy-reports:
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: always()

    steps:
      - name: Download Test Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: allure-report-*
          merge-multiple: true

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./artifacts/

  notify:
    runs-on: ubuntu-latest
    needs: [test, security-scan, performance-test, dependency-update, batch-processing]
    if: always()

    steps:
      - name: Send Slack Notification
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#cpms-testing'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author,action,eventName,ref,workflow

      - name: Send Email Notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CPMS Test Failure - ${{ github.ref }}"
          body: |
            CPMS Testing Framework has test failures.
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Check the GitHub Actions run for details.
          to: qa-team@company.com
          from: noreply@company.com